name: GABBE CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    # Python 3.8 (EOL Oct 2024) is allowed to fail: the runtime package supports
    # it, but the dev/test toolchain (pytest 9, black 25, …) has dropped 3.8, so
    # the full suite cannot be installed there. requires-python is kept at >=3.8
    # for now; bumping it to >=3.9 is tracked as a v2 (breaking) item.
    continue-on-error: ${{ matrix.python-version == '3.8' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - os: ubuntu-22.04
            python-version: '3.8'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install package and dev dependencies
      run: pip install -e ".[dev]"

    - name: Validate Skills Metadata
      run: python3 agents/scripts/validate_skills.py

    - name: Validate Project Integrity
      run: python3 agents/scripts/validate_integrity.py

    - name: Validate Markdown Links
      run: python3 agents/scripts/validate_links.py

    - name: Verify Setup Simulation
      run: python3 agents/scripts/verify_setup_simulation.py

    - name: Verify Use Cases
      run: python3 agents/scripts/verify_use_cases.py

    - name: Verify Triggers and MCP Bindings
      run: python3 agents/scripts/verify_triggers_and_mcps.py

    - name: Run tests
      run: pytest gabbe/tests/ scripts/tests/ -v

  lint:
    name: Lint & type-check (ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      run: pip install -e ".[dev]"
    - name: ruff
      run: ruff check gabbe scripts agents/scripts
    - name: black --check
      run: black --check gabbe scripts agents/scripts
    - name: mypy
      run: mypy gabbe

  gates:
    name: Backward-compatibility gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      run: |
        python -m venv .venv
        .venv/bin/pip install -e ".[dev]" pip-audit
    - name: Run verification gates
      run: ./scripts/gates/run_gates.sh
