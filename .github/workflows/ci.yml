name: GABBE CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * *'   # nightly eval lane (Track E3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 reached EOL in Oct 2024 and the dev/test toolchain
        # (pytest 9, black 25, …) has dropped it; minimum supported is 3.9.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install package and dev dependencies
      run: pip install -e ".[dev]"

    - name: Validate Skills Metadata
      run: python3 agents/scripts/validate_skills.py

    - name: Validate Project Integrity
      run: python3 agents/scripts/validate_integrity.py

    - name: Validate Markdown Links
      run: python3 agents/scripts/validate_links.py

    - name: Validate Lifecycle Wording
      run: python3 agents/scripts/validate_lifecycle.py

    - name: Check the lite skills index is up to date
      run: python3 agents/scripts/build_skills_index_lite.py --check

    - name: Verify Setup Simulation
      run: python3 agents/scripts/verify_setup_simulation.py

    - name: Verify Use Cases
      run: python3 agents/scripts/verify_use_cases.py

    - name: Verify Triggers and MCP Bindings
      run: python3 agents/scripts/verify_triggers_and_mcps.py

    - name: Validate Methodology Graph
      run: python3 agents/scripts/validate_methodology_graph.py

    - name: Verify E2E init flows (local, global, custom)
      run: python3 agents/scripts/verify_e2e_init_flows.py

    - name: Eval suites self-check (deterministic, no model)
      run: python3 agents/scripts/eval_skills.py

    - name: Run tests
      run: pytest gabbe/tests/ scripts/tests/ -v -m "not slow and not live_llm and not mutation"

  lint:
    name: Lint & type-check (ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      run: pip install -e ".[dev]"
    - name: ruff
      run: ruff check gabbe scripts agents/scripts
    - name: black --check
      run: black --check gabbe scripts agents/scripts
    - name: mypy
      run: mypy gabbe

  gates:
    name: Backward-compatibility gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      # Python 3.12 gate: test exactly what is locked (hashed lock, generated for
      # 3.12), then the package itself without dependencies. pip-audit is a gate
      # tool, not a dependency of the package, so it is added after the lock.
      run: |
        python -m venv .venv
        .venv/bin/pip install --require-hashes -r requirements-lock.txt
        .venv/bin/pip install --no-deps -e .
        .venv/bin/pip install pip-audit
    - name: Run verification gates
      run: ./scripts/gates/run_gates.sh

  install-matrix:
    name: One-command install + autodetect (multi-OS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install (Python channel, single command)
      run: pip install -e ".[dev]"
    - name: Autodetect environment + agents (gabbe doctor)
      run: gabbe doctor
    - name: One-command-install + autodetect tests
      run: pytest scripts/tests/test_autodetect.py scripts/tests/test_one_command_install.py -v

  node-and-shell:
    name: Node installer tests + state export/import under sh (dash)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    # Uses the Node that the ubuntu runner image ships (no pin needed for these tests).
    # Python + the CLI are installed so the install -> `gabbe uninstall --purge`
    # round-trip test runs here instead of being skipped.
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install the CLI (for the uninstall round trip)
      run: pip install -e .
    - name: Node installer tests (npm test)
      run: npm test
    - name: State export/import round trip under sh (dash on Ubuntu)
      run: |
        set -eu
        W="$RUNNER_TEMP/state-lab"; mkdir -p "$W/src/agents/memory" "$W/src/project" "$W/out" "$W/dst"
        echo "GABBE Kit version: 0" > "$W/src/agents/CONSTITUTION.md"; echo m > "$W/src/agents/memory/PROJECT_STATE.md"; echo t > "$W/src/project/TASKS.md"
        sh agents/scripts/state_export.sh "$W/src" "$W/out"
        sh agents/scripts/state_import.sh --apply "$W"/out/gabbe-state-*.tar.gz "$W/dst"
        test "$(cat "$W/dst/agents/memory/PROJECT_STATE.md")" = m

  bootstrap-scripts-windows:
    name: PowerShell bootstrap scripts (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install the CLI
      run: pip install -e .
    - name: install.ps1 -Help exits 0
      shell: pwsh
      run: |
        $out = ./install.ps1 -Help | Out-String
        if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Help exited $LASTEXITCODE" }
        if ($out -notmatch 'Usage') { throw 'install.ps1 -Help printed no usage' }
    - name: Install into a temporary folder with the Node installer
      shell: pwsh
      run: |
        $proj = Join-Path $env:RUNNER_TEMP 'gabbe-proj'
        New-Item -ItemType Directory -Path $proj | Out-Null
        Push-Location $proj
        node "$env:GITHUB_WORKSPACE/bin/install.js" init --yes --agents claude
        $code = $LASTEXITCODE
        Pop-Location
        if ($code -ne 0) { throw "node bin/install.js init exited $code" }
        if (-not (Test-Path "$proj/agents/AGENTS.md")) { throw 'the kit was not installed' }
    - name: uninstall.ps1 -DryRun lists what it would remove
      shell: pwsh
      run: |
        $proj = Join-Path $env:RUNNER_TEMP 'gabbe-proj'
        $out = ./uninstall.ps1 -DryRun -Dir $proj | Out-String
        if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 -DryRun exited $LASTEXITCODE" }
        if ($out -notmatch 'Would remove') { throw "no 'Would remove' line in: $out" }
        if (-not (Test-Path "$proj/agents/AGENTS.md")) { throw 'the dry run changed the project' }
    - name: uninstall.ps1 removes the kit
      shell: pwsh
      run: |
        $proj = Join-Path $env:RUNNER_TEMP 'gabbe-proj'
        ./uninstall.ps1 -Dir $proj
        if ($LASTEXITCODE -ne 0) { throw "uninstall.ps1 exited $LASTEXITCODE" }
        if (Test-Path "$proj/agents") { throw 'the agents folder is still there' }

  nightly-evals:
    name: Nightly skill evals (live, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      # The home-grown harness reuses gabbe/llm.py and needs no extra deps; the
      # optional [evals] extra (ragas/deepeval/langfuse) is left out so heavy libs
      # never enter the audited dependency set.
      run: pip install -e ".[dev]"
    - name: Eval suites self-check (deterministic)
      run: python3 agents/scripts/eval_skills.py
    - name: Mutation testing on core modules (score checked in the last step)
      continue-on-error: true   # a failed run must not stop the live evals; the floor step reports it
      run: |
        # mutmut 3.x reads its settings from setup.cfg; the 2.x option --paths-to-mutate is gone.
        # The tests listed are the ones that cover the three modules (same list as the measured floor).
        pip install "mutmut==3.8.1"
        cat > setup.cfg <<'EOF'
        [mutmut]
        source_paths=gabbe
        only_mutate=
            gabbe/budget.py
            gabbe/sync.py
            gabbe/route.py
        pytest_add_cli_args_test_selection=
            gabbe/tests/test_budget.py
            gabbe/tests/test_budget_properties.py
            gabbe/tests/test_sync.py
            gabbe/tests/test_sync_fallback.py
            gabbe/tests/test_sync_markers.py
            gabbe/tests/test_sync_properties.py
            gabbe/tests/test_sync_stateful.py
            gabbe/tests/test_route.py
            gabbe/tests/test_route_properties.py
        EOF
        mutmut run 2>&1 | tee mutation-run.txt || true
        mutmut results 2>&1 | tee mutation-results.txt || true
        mutmut export-cicd-stats 2>&1 | tee -a mutation-run.txt || true
        cp mutants/mutmut-cicd-stats.json mutation-stats.json || true
        # Make the score visible: the last progress line carries the killed/survived
        # counters as mutmut prints them; survivors are listed below it.
        {
          echo "### Mutation testing (mutmut)"
          echo '```'
          tr '\r' '\n' < mutation-run.txt | grep . | tail -n 3
          echo '```'
          echo "Survivors:"
          echo '```'
          cat mutation-results.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Live skill evals (scores against the model — non-blocking)
      # The API key is read only on the default branch (the nightly schedule, or a
      # manual run started on main); a manual run on another ref skips this step.
      if: github.ref == 'refs/heads/main'
      continue-on-error: true   # nondeterministic; reports drift, never blocks (v1.1 makes it a gate)
      env:
        GABBE_LIVE_LLM: '1'
        GABBE_API_KEY: ${{ secrets.GABBE_API_KEY }}
      run: python3 agents/scripts/eval_skills.py --live --out eval-scorecard.json
    - name: Upload eval scorecard
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: eval-scorecard
        path: eval-scorecard.json
        if-no-files-found: ignore
    - name: Upload mutation result
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: mutation-result
        path: |
          mutation-run.txt
          mutation-results.txt
          mutation-stats.json
        if-no-files-found: ignore
    - name: Mutation score floor (fails this nightly job below the floor, never a pull request)
      if: ${{ !cancelled() }}
      run: python3 scripts/gates/check_mutation_floor.py --stats mutation-stats.json | tee -a "$GITHUB_STEP_SUMMARY"
