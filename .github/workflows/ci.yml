name: GABBE CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * *'   # nightly eval lane (Track E3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 reached EOL in Oct 2024 and the dev/test toolchain
        # (pytest 9, black 25, …) has dropped it; minimum supported is 3.9.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install package and dev dependencies
      run: pip install -e ".[dev]"

    - name: Validate Skills Metadata
      run: python3 agents/scripts/validate_skills.py

    - name: Validate Project Integrity
      run: python3 agents/scripts/validate_integrity.py

    - name: Validate Markdown Links
      run: python3 agents/scripts/validate_links.py

    - name: Verify Setup Simulation
      run: python3 agents/scripts/verify_setup_simulation.py

    - name: Verify Use Cases
      run: python3 agents/scripts/verify_use_cases.py

    - name: Verify Triggers and MCP Bindings
      run: python3 agents/scripts/verify_triggers_and_mcps.py

    - name: Validate Methodology Graph
      run: python3 agents/scripts/validate_methodology_graph.py

    - name: Eval suites self-check (deterministic, no model)
      run: python3 agents/scripts/eval_skills.py

    - name: Run tests
      run: pytest gabbe/tests/ scripts/tests/ -v -m "not slow and not live_llm and not mutation"

  lint:
    name: Lint & type-check (ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      run: pip install -e ".[dev]"
    - name: ruff
      run: ruff check gabbe scripts agents/scripts
    - name: black --check
      run: black --check gabbe scripts agents/scripts
    - name: mypy
      run: mypy gabbe

  gates:
    name: Backward-compatibility gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      run: |
        python -m venv .venv
        .venv/bin/pip install -e ".[dev]" pip-audit
    - name: Run verification gates
      run: ./scripts/gates/run_gates.sh

  install-matrix:
    name: One-command install + autodetect (multi-OS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install (Python channel, single command)
      run: pip install -e ".[dev]"
    - name: Autodetect environment + agents (gabbe doctor)
      run: gabbe doctor
    - name: One-command-install + autodetect tests
      run: pytest scripts/tests/test_autodetect.py scripts/tests/test_one_command_install.py -v

  nightly-evals:
    name: Nightly skill evals (live, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install
      # The home-grown harness reuses gabbe/llm.py and needs no extra deps; the
      # optional [evals] extra (ragas/deepeval/langfuse) is left out so heavy libs
      # never enter the audited dependency set.
      run: pip install -e ".[dev]"
    - name: Eval suites self-check (deterministic)
      run: python3 agents/scripts/eval_skills.py
    - name: Mutation testing on core modules (non-blocking)
      continue-on-error: true   # mutation score is a quality signal, not a gate
      run: |
        mutmut run --paths-to-mutate "gabbe/budget.py,gabbe/sync.py,gabbe/route.py" || true
        mutmut results || true
    - name: Live skill evals (scores against the model — non-blocking)
      continue-on-error: true   # nondeterministic; reports drift, never blocks (v1.1 makes it a gate)
      env:
        GABBE_LIVE_LLM: '1'
        GABBE_API_KEY: ${{ secrets.GABBE_API_KEY }}
      run: python3 agents/scripts/eval_skills.py --live --out eval-scorecard.json
    - name: Upload eval scorecard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eval-scorecard
        path: eval-scorecard.json
        if-no-files-found: ignore
