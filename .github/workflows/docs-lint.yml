name: Docs Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    # Report-only for now; the skill/template/guide corpus predates the lint
    # config. Flip to blocking after the corpus is brought into compliance.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !**/node_modules
            !.venv
            !agents/skills/**

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    # Report-only: external links rate-limit/404 transiently; failing the PR on
    # third-party link rot is too noisy. The repo's own validate_links.py gates
    # internal links in the main CI job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true
