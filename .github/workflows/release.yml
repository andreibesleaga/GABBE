name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # --- Detect whether the PyPI token is present. The `secrets` context cannot
  # be used in a job-level `if:`, so we read it inside a step here and expose
  # a boolean that the PyPI jobs gate on via `needs`. This keeps the workflow
  # green when the token is absent. npm is published by publish-npm.yml on the
  # same tag, with npm trusted publishing (OIDC, no token). ---
  secret-gate:
    name: Detect publish secrets
    runs-on: ubuntu-latest
    outputs:
      has_pypi: ${{ steps.check.outputs.has_pypi }}
    steps:
      - id: check
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then echo "has_pypi=true" >> "$GITHUB_OUTPUT"; else echo "has_pypi=false" >> "$GITHUB_OUTPUT"; fi

  # --- Existing job: build sdist+wheel, generate a CycloneDX SBOM, attach. ---
  sbom-and-build:
    name: Build + CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tooling
        run: pip install build cyclonedx-bom

      - name: Build sdist + wheel
        run: python -m build

      - name: Generate CycloneDX 1.6 SBOM
        run: |
          pip install -e .
          cyclonedx-py environment --output-format JSON --spec-version 1.6 --output-file sbom.json

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            sbom.json

  # --- Build the npm package tarball and a standalone kit tarball. ---
  build-npm-and-kit:
    name: Build npm + kit tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Smoke-test the Node installer
        run: node bin/install.js --help

      - name: npm pack (creates gabbe-<version>.tgz)
        run: npm pack

      - name: Build standalone kit tarball
        run: |
          mkdir -p dist
          tar -czf "dist/gabbe-kit.tar.gz" agents docs scripts/init.py install.sh install.ps1 bin/install.js package.json README.md LICENSE LICENSE-CODE

      - name: Attach npm + kit tarballs to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./*.tgz
            dist/gabbe-kit.tar.gz

  # --- Publish to PyPI ONLY when PYPI_API_TOKEN is configured (gated on the
  # secret-gate job's output, since `secrets` cannot be used in `if:`). ---
  publish-pypi:
    name: Publish to PyPI
    needs: [secret-gate, sbom-and-build]
    runs-on: ubuntu-latest
    if: needs.secret-gate.outputs.has_pypi == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build + twine
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

  # --- Post-publish verification (Track E8): install the PUBLISHED package from
  # PyPI on every OS and confirm a single-command install + autodetect works. The
  # npm channel is smoke-tested by build-npm-and-kit and publish-npm.yml. ---
  release-verify:
    name: Verify published install (multi-OS)
    needs: [secret-gate, publish-pypi]
    if: needs.secret-gate.outputs.has_pypi == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the published package (single command, with PyPI-propagation retry)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if pip install "gabbe==$VERSION"; then exit 0; fi
            echo "PyPI not ready (attempt $attempt); waiting..."; sleep 30
          done
          echo "published gabbe==$VERSION not installable after retries"; exit 1
      - name: Verify version + autodetect (gabbe doctor)
        shell: bash
        run: |
          gabbe --version
          gabbe doctor
