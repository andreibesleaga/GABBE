name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # --- Gate: nothing is published or attached from a tag whose tree fails its
  # tests or whose version numbers disagree with the tag. Every job below that
  # publishes or attaches release assets needs this job (the same gate is called by
  # publish-npm.yml and publish-github-packages.yml). ---
  gate:
    name: Gate (tests + tag equals version)
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
    with:
      ref_name: ${{ github.ref_name }}

  # --- Detect whether the PyPI token is present. The `secrets` context cannot
  # be used in a job-level `if:`, so we read it inside a step here and expose
  # a boolean that the PyPI job reads via `needs` to choose its publishing path
  # (token when present, otherwise PyPI trusted publishing; either way the job
  # fails when it cannot publish). npm is published by publish-npm.yml on the
  # same tag, with npm trusted publishing (OIDC, no token). ---
  secret-gate:
    name: Detect publish secrets
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has_pypi: ${{ steps.check.outputs.has_pypi }}
    steps:
      - id: check
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then echo "has_pypi=true" >> "$GITHUB_OUTPUT"; else echo "has_pypi=false" >> "$GITHUB_OUTPUT"; fi

  # --- Existing job: build sdist+wheel, generate a CycloneDX SBOM, attach. ---
  sbom-and-build:
    name: Build + CycloneDX SBOM
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaches the release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: pip install build==1.6.1 cyclonedx-bom==7.6.0

      - name: Build sdist + wheel
        run: python -m build

      # The SBOM describes the package's own runtime dependencies: the built wheel is
      # installed into a clean environment (no build tools, no dev extras) and that
      # environment is read. (requirements-lock.txt includes the dev extras.)
      - name: Generate CycloneDX 1.6 SBOM of the installed wheel
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/sbom-venv"
          python -m pip --python "$RUNNER_TEMP/sbom-venv/bin/python" install dist/*.whl
          cyclonedx-py environment --output-format JSON --spec-version 1.6 --pyproject pyproject.toml --output-file sbom.json "$RUNNER_TEMP/sbom-venv/bin/python"

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*
            sbom.json

  # --- Build the npm package tarball and a standalone kit tarball. ---
  build-npm-and-kit:
    name: Build npm + kit tarballs
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaches the release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Smoke-test the Node installer
        run: node bin/install.js --help

      - name: npm pack (creates gabbe-<version>.tgz)
        run: npm pack

      - name: Build standalone kit tarball
        run: |
          mkdir -p dist
          tar -czf "dist/gabbe-kit.tar.gz" agents docs scripts/init.py install.sh install.ps1 bin/install.js package.json README.md LICENSE LICENSE-CODE

      - name: Attach npm + kit tarballs to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            ./*.tgz
            dist/gabbe-kit.tar.gz

  # --- Publish to PyPI. Two paths, one job:
  #   1. PYPI_API_TOKEN present: twine with the token (as before).
  #   2. token absent: PyPI trusted publishing through the official PyPA action
  #      (OIDC, no secret, attestations on by default). This needs the trusted
  #      publisher to be registered on pypi.org for this repository, workflow
  #      `release.yml` and environment `pypi`.
  # If neither path can publish, this job fails: a release never ends green
  # without reaching PyPI. ---
  publish-pypi:
    name: Publish to PyPI
    needs: [secret-gate, sbom-and-build, gate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (path 2); unused by the token path
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install build + twine
        run: pip install build==1.6.1 twine==7.0.0

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI with the token
        if: needs.secret-gate.outputs.has_pypi == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

      - name: Publish to PyPI with trusted publishing
        if: needs.secret-gate.outputs.has_pypi != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # --- Post-publish verification (Track E8): install the PUBLISHED package from
  # PyPI on every OS and confirm a single-command install + autodetect works. The
  # npm channel is smoke-tested by build-npm-and-kit and publish-npm.yml. ---
  release-verify:
    name: Verify published install (multi-OS)
    needs: [publish-pypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install the published package (single command, with PyPI-propagation retry)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            # --no-cache-dir: pip caches PyPI's index page for about 10 minutes, so without it every
            # retry after a first miss reads the stale page from before the upload.
            if pip install --no-cache-dir "gabbe==$VERSION"; then exit 0; fi
            echo "PyPI not ready (attempt $attempt); waiting..."; sleep 30
          done
          echo "published gabbe==$VERSION not installable after retries"; exit 1
      - name: Verify version + autodetect (gabbe doctor)
        shell: bash
        run: |
          gabbe --version
          gabbe doctor
