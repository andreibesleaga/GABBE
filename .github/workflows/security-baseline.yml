name: Security Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  osv-scanner:
    name: OSV-Scanner (Python deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=requirements-lock.txt
            --format=sarif
            --output=osv.sarif
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  pip-audit:
    name: pip-audit (CVE delta gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install + audit
        run: |
          pip install pip-audit
          # Audit the pinned dependency set; the local editable `gabbe` package
          # is not on PyPI and cannot be audited, so we scan the lockfile.
          pip-audit -r requirements-lock.txt

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    # Report-only: prints findings to the job log. Table output (not SARIF
    # upload, which needs code-scanning enabled) + exit-code 0 keeps it green.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy (fs)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
