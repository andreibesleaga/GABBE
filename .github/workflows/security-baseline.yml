name: Security Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  osv-scanner:
    name: OSV-Scanner (Python deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=requirements-lock.txt
            --format=sarif
            --output=osv.sarif
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  pip-audit:
    name: pip-audit (CVE delta gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install + audit
        run: |
          pip install pip-audit
          # Audit the pinned dependency set; the local editable `gabbe` package
          # is not on PyPI and cannot be audited, so we scan the lockfile.
          pip-audit -r requirements-lock.txt

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    # Report-only (uploads SARIF to code-scanning). exit-code 0 keeps the scan
    # step green; the SARIF upload soft-fails if code-scanning is not enabled.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy (fs)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
